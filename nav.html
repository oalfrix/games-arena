<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameArena - PC & Free Games</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <a href="#" class="logo">
            <i class="fas fa-gamepad"></i>
            Games Arena
        </a>
        <div class="nav-buttons">
            <button class="nav-btn active" data-filter="all">Games</button>
            <button class="nav-btn" data-filter="pc">PC Games</button>
            <button class="nav-btn" data-filter="free">Free Games</button>
            <a href="https://whatsapp.com/channel/0029VbAFPhl4dTnHkAkJn02I" target="_blank" class="whatsapp-btn">
                <i class="fab fa-whatsapp"></i>
                WhatsApp
            </a>
            <a href="https://t.me/pclaptopgamesarena" target="_blank" class="telegram-btn">
                <i class="fab fa-telegram"></i>
                Telegram
            </a>
        </div>

        <div class="menu">
    
    <a href="#" class="menu-link">
      <span class="menu-icon">
        <span class="menu-line menu-line-1"></span>
        <span class="menu-line menu-line-2"></span>
        <span class="menu-line menu-line-3"></span>
      </span>
    </a>
  </div>

  

    </div>

    <style>
        .menu {
  position: absolute;
  top: 20px;
  right: 20px;
  height: 46px;
  width: 46px;
}

.menu-link {
  width: 100%;
  height: 100%;
  position: absolute;
  z-index: 1002;
}

.menu-icon {
  position: absolute;
  background-color: red;
  width: 20px;
  height: 14px;
  margin: auto;
  left: 0;
  top: 0;
  right: 0;
  bottom: 1px;
}





.menu-overlay {
  background-color: #3c4f65;
  height: auto;
  width: 80%;
  position: fixed;
  text-align: center;
  transition: opacity 0.44s ease-in-out;
  z-index: 1001;
  opacity: 0;
  right: 0;
}

.menu-overlay a {
  color: #eeeaea;
  font-weight: 600;
  font-size: 32px;
  padding: 2;
  margin:  15% 1% ;
  display: block;
}

.menu-line {
  background-color: #333;
  height: 2px;
  width: 100%;
  border-radius: 2px;
  position: absolute;
  left: 0;
  transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.menu-line-1 { top: 0; }

.menu-line-2 {
  top: 0;
  bottom: 0;
  margin: auto;
}

.menu-line-3 { bottom: 0; }

.menu:hover .menu-circle { transform: scale(1.4); }

.menu-overlay.open {
  opacity: 1;
  visibility: visible;
}

.menu.open .menu-circle { 
  transform: scale(60);
}

.menu.open .menu-line-2 { opacity: 0; }

.menu.open .menu-line-1 {
  transform: translateY(7px) translateY(-50%) rotate(-135deg);
}

.menu.open .menu-line-3 {
  transform: translateY(-7px) translateY(50%) rotate(135deg);
}
    </style>

    <script>
        $(function() {
  
  $(".menu-link").click(function(e) {
    e.preventDefault();
    
    $(".menu-overlay").toggleClass("open");
    $(".menu").toggleClass("open");

  });
	
});

    </script>
</body>
</html>
